version: 2
updates:
  # Gradle dependencies (Spring Boot, ASM, JDBC drivers, test libs).
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Spring Boot 3.5.x is the supported baseline (see ROADMAP → Platform compatibility).
      # 4.x is a deliberate migration track, not an automated bump — keep receiving 3.5.x
      # patches/minors, but do not propose major jumps. Every explicitly-versioned Spring
      # Boot coordinate in the repo is listed by exact name (no wildcard, to avoid ignoring
      # anything unintended). Starters are BOM-managed (no explicit version) so Dependabot
      # never bumps them and they need no entry. If a new explicitly-versioned Spring Boot
      # coordinate is added, add it here too.
      - dependency-name: "org.springframework.boot"                       # root plugins DSL (build.gradle)
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springframework.boot:spring-boot-gradle-plugin"  # examples buildscript classpath
        update-types: ["version-update:semver-major"]
      # Shadow 9.x requires Gradle 9.2+ (min Gradle bumped in 9.5.0); this repo runs the
      # Gradle 8.14.x wrapper, so a 9.x bump fails the build (Gradle 9 build API). The
      # Gradle 8 -> 9 upgrade is a deliberate build-toolchain track (see ROADMAP -> Build
      # toolchain), not an automated bump — keep 8.x patches/minors, block 9.x majors.
      - dependency-name: "com.gradleup.shadow"                            # root plugins DSL (build.gradle)
        update-types: ["version-update:semver-major"]
      # The wrapper itself is the other half of that same track. Blocking only the plugins left
      # a gap: Dependabot proposed the Gradle 8 -> 9 wrapper bump directly (PR #71, closed), and
      # its CI was green — because the PR jobs run test/bootJar, not the release path (publish,
      # jib, verifyReleaseArtifactSet) or archive reproducibility, which Gradle 9 enables by
      # default. A green check there does not authorize the move. The wrapper goes to 9.x as one
      # verified change together with the Shadow/Jib majors, so keep 8.x patches/minors here too.
      - dependency-name: "gradle-wrapper"                                 # gradle/wrapper/gradle-wrapper.properties
        update-types: ["version-update:semver-major"]
      # The json-schema-validator is pinned to the 1.5.x line by build.gradle (compileOnly for the
      # optional strict-schema path, testImplementation for the schema conformance tests) and by
      # the quickstart example's runtimeOnly. 2.x rewrote the API — JsonSchemaFactory, SpecVersion
      # and ValidationMessage are gone (ValidationMessage became Error) — and 3.x additionally
      # moved to Jackson 3 (tools.jackson), while this project's baseline is Jackson 2
      # (com.fasterxml) from Spring Boot 3.5.x. Dependabot proposed 1.5.9 -> 3.0.7 regardless
      # (PR #74, closed) and NetworkntSchemaValidator failed to compile. 1.5.9 is the last release
      # of the 1.5.x line, so every future offer is a major — block them here. Leaving 1.5.x means
      # rewriting that validator, and for 3.x also moving the platform's Jackson generation; that
      # is a deliberate change, not an automated bump.
      - dependency-name: "com.networknt:json-schema-validator"            # build.gradle + examples/quickstart/build.gradle
        update-types: ["version-update:semver-major"]

  # GitHub Actions used in .github/workflows/.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
